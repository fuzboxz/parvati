# Parvati CI — two lanes (memory-safety wave 2026-08-22):
#
#   pr-gate (every push/PR): tests-only Debug build + the full unified suite
#     minus the two heaviest tests (loader_fuzz ~10 min, perf_smoke). Catches
#     every Source/ + tests/ compile break and the bulk of behavior
#     regressions in ~15 min. The tests-only configure compiles the plugin
#     sources themselves, so plugin-code compile breaks are still caught —
#     only the format wrappers (AU/VST3/CLAP entry points) are skipped.
#
#   nightly (schedule + manual): everything the local policy runs —
#     (a) the FULL native suite (all 117),
#     (b) a Release plugin-format build (Standalone+VST3+CLAP) proving the
#         format wrappers + the Release-only libc++ hardening configure,
#     (c) the full ASan+UBSan sweep via tools/run_sanitizers.sh,
#     (d) TSan on the concurrency-critical subset (full-suite TSan is the
#         documented next step — loader_fuzz OOMs under TSan today; see
#         MIGRATION_STATUS.md §Sanitizer validation).
#
# External deps the build needs that a fresh clone lacks (NOTICES.md /
# CMakeLists.txt headers): the Ambika firmware reference tree (untracked,
# GPL3) and a JUCE 9.0.1 checkout at ~/JUCE. Both are cloned per run — small,
# deterministic, nothing to cache-rot.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly, 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single-config, single-dir policy (CLAUDE.md): build_unified is the
  # canonical dir; sanitizer dirs are created ON DEMAND by the script.
  CMAKE_BUILD_TYPE: Debug

jobs:
  pr-gate:
    name: PR gate — tests-only Debug + suite (minus heavy)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch deps (ambika_reference + JUCE 9.0.1)
        run: |
          git clone --depth 1 https://github.com/pichenettes/ambika.git ambika_reference
          git clone --depth 1 --branch 9.0.1 https://github.com/juce-framework/JUCE.git ~/JUCE

      - name: Configure (tests-only)
        run: >
          cmake -B build_unified -DCMAKE_BUILD_TYPE=Debug
          -DPARVATI_FORMATS= -DPARVATI_BUILD_CLAP=OFF

      - name: Build unified test binary
        run: cmake --build build_unified --target parvati_unified_tests -j4

      - name: Run suite (all but loader_fuzz / perf_smoke)
        run: |
          # `list` prints two-space-indented names; strip, drop the two
          # heaviest, re-expand into the runner's argv.
          TESTS=$(./build_unified/parvati_unified_tests list \
                    | sed 's/^ *//' | grep -v '^Available\|^JUCE' \
                    | grep -v -e '^loader_fuzz_test$' -e '^perf_smoke_test$' | tr '\n' ' ')
          echo "Running:${TESTS}"
          # shellcheck disable=SC2086
          ./build_unified/parvati_unified_tests ${TESTS}

  nightly:
    name: Nightly — full suite + Release formats + sanitizers
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Fetch deps (ambika_reference + JUCE 9.0.1)
        run: |
          git clone --depth 1 https://github.com/pichenettes/ambika.git ambika_reference
          git clone --depth 1 --branch 9.0.1 https://github.com/juce-framework/JUCE.git ~/JUCE

      # (a) Full native suite (Debug, tests-only build).
      - name: Configure + build (tests-only)
        run: >
          cmake -B build_unified -DCMAKE_BUILD_TYPE=Debug
          -DPARVATI_FORMATS= -DPARVATI_BUILD_CLAP=OFF
          && cmake --build build_unified --target parvati_unified_tests -j4

      - name: Full native suite (all tests)
        run: ./build_unified/parvati_unified_tests

      # (b) Release plugin-format build: proves the AU/VST3/CLAP wrappers
      #     compile AND the Release-only libc++ hardening block configures
      #     ("Parvati: libc++ hardened mode FAST" in the configure log).
      #     Standalone+VST3 need no signing; CLAP exercises the pinned
      #     clap-juce-extensions FetchContent.
      - name: Release formats build (Standalone+VST3+CLAP)
        run: >
          cmake -B build_release -DCMAKE_BUILD_TYPE=Release
          -DPARVATI_FORMATS="Standalone;VST3" -DPARVATI_BUILD_CLAP=ON
          && cmake --build build_release --target Parvati_VST3 Parvati_Standalone Parvati_CLAP -j4

      # (c) Full ASan+UBSan sweep (the script creates its own tests-only
      #     build_san_asan tree; ~45-60 min for all tests).
      - name: ASan+UBSan full sweep
        run: SKIP_TSAN=1 tools/run_sanitizers.sh

      # (d) TSan on the concurrency-critical subset (full-suite TSan blocked
      #     by the documented loader_fuzz OOM; the script re-runs
      #     concurrency_test 3x under TSan on top of the direct pass).
      - name: TSan (concurrency-critical subset)
        run: >
          tools/run_sanitizers.sh concurrency_test os_reaper_test
          param_thread_test realtime_test arp_test sequencer_test
