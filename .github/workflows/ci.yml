# CI — macOS (Apple Silicon) build + fast test subset.
#
# Scope note: the repo has 118 test binaries; free GitHub runners cannot run
# the full set inside a reasonable job budget, so this workflow builds the
# plugin formats and runs a REPRESENTATIVE subset (the core engine suite +
# key unit/regression tests) plus the static scanners. Run the full suite
# locally (`cmake --build build && for t in build/parvati_*test ... `) or on a
# self-hosted runner before a release tag.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_VERSION: '9.0.1'          # tag in juce-framework/JUCE
  BUILD_DIR: build-ci

jobs:
  macos:
    name: macOS 15 (arm64) — VST3/AU/CLAP/Standalone + tests
    runs-on: macos-15            # Apple Silicon runner
    timeout-minutes: 90

    steps:
      - name: Checkout Parvati
        uses: actions/checkout@v4

      - name: Restore JUCE checkout (cache)
        uses: actions/cache@v4
        with:
          path: ~/JUCE
          key: juce-${{ env.JUCE_VERSION }}-macos-arm64

      - name: Clone JUCE (no-op on cache hit)
        run: |
          if [ ! -f "$HOME/JUCE/CMakeLists.txt" ]; then
            git clone --branch "$JUCE_VERSION" --depth 1 \
              https://github.com/juce-framework/JUCE "$HOME/JUCE"
          fi
          grep -q "VERSION $JUCE_VERSION" "$HOME/JUCE/CMakeLists.txt" \
            || { echo "JUCE checkout version mismatch"; exit 1; }

      - name: Show toolchain
        run: |
          cmake --version
          xcodebuild -version
          uname -m

      - name: Configure (Release, CLAP on)
        run: >
          cmake -S . -B "$BUILD_DIR"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build plugin formats
        run: >
          cmake --build "$BUILD_DIR" -j 3
          --target Parvati_VST3 Parvati_AU Parvati_CLAP Parvati_Standalone

      - name: Build + run test subset
        run: |
          set -e
          TESTS=(
            parvati_tests                 # core engine/behavioral suite
            parvati_apvts_test            # APVTS parameter bridge
            parvati_host_param_text_test  # host value-to-text + grouping
            parvati_tuning_test           # raga tuning + state backcompat
            parvati_preset_test           # .parvati format round-trips
            parvati_patch_load_test       # .PRO/.MUL loading
            parvati_roundtrip_golden_test # golden save/load round-trips
            parvati_fixed_math_test       # DSP fixed-point corners
            parvati_transport_clock_test  # transport clock math
            parvati_note_stack_test       # note stack semantics
            parvati_render_quality_test   # offline OS / tail / chunked render
          )
          # NOTE: the full suite is 118 binaries — run locally before release.
          for t in "${TESTS[@]}"; do
            echo "::group::$t"
            cmake --build "$BUILD_DIR" -j 3 --target "$t"
            "./$BUILD_DIR/$t"
            echo "::endgroup::"
          done

      - name: Static scanners
        run: cmake --build "$BUILD_DIR" --target parvati_static_checks

      - name: Collect artefacts
        run: |
          mkdir -p artefacts
          for d in VST3 AU CLAP Standalone; do
            if [ -d "$BUILD_DIR/Parvati_artefacts/Release/$d" ]; then
              ditto -c -k --keepParent \
                "$BUILD_DIR/Parvati_artefacts/Release/$d" \
                "artefacts/Parvati-$d.zip"
            fi
          done

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Parvati-macOS-arm64
          path: artefacts/
          retention-days: 14
